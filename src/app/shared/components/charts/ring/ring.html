<svg [attr.width]="taille()" [attr.height]="taille()" viewBox="0 0 100 100">
  <circle cx="50" cy="50" r="42" fill="none" style="stroke: var(--muted-bg)" [attr.stroke-width]="epaisseur()" />
  <circle cx="50" cy="50" r="42" fill="none" [style.stroke]="couleur()" [attr.stroke-width]="epaisseur()" stroke-linecap="round"
          [attr.stroke-dasharray]="(C * borne()) / 100 + ' ' + C" transform="rotate(-90 50 50)" />
</svg>
<div class="centre"><strong [style.font-size.px]="taille() * 0.2">{{ borne() }} %</strong>
  @if (legende()) { <span>{{ legende() }}</span> }</div>
