<svg viewBox="0 0 300 220" preserveAspectRatio="none" class="chart">
  <defs><linearGradient id="aire" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color: var(--secondary)" stop-opacity=".22"/><stop offset="1" style="stop-color: var(--secondary)" stop-opacity="0"/></linearGradient></defs>
  @for (g of [0, 50, 100]; track g) {
    <line x1="30" x2="300" [attr.y1]="y(g)" [attr.y2]="y(g)" style="stroke: var(--muted-bg)" stroke-dasharray="3 3" />
    <text x="24" [attr.y]="y(g) + 4" text-anchor="end" class="axe">{{ g }} %</text>
  }
  @if (trace(); as t) {
    <path [attr.d]="t.aire" fill="url(#aire)" />
    <path [attr.d]="t.ligne" fill="none" style="stroke: var(--secondary)" stroke-width="2.2" />
    <circle [attr.cx]="t.dernier.x" [attr.cy]="t.dernier.y" r="5" style="fill: var(--surface); stroke: var(--secondary)" stroke-width="2.5" />
  }
  @for (l of etiquettes(); track l.texte) { <text [attr.x]="l.x" y="216" text-anchor="middle" class="axe">{{ l.texte }}</text> }
</svg>
@if (trace(); as t) { <span class="valeur" [style.left.%]="(t.dernier.x / 300) * 100" [style.top.%]="(t.dernier.y / 220) * 100">{{ t.derniereValeur }} %</span> }
