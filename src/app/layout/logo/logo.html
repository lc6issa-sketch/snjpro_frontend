@if (ecusson()) {
  <span class="embleme ecusson" [style.width.px]="taille() * 0.8" [style.height.px]="taille() * 1.02">
    <img [src]="embleme()" alt="" />
  </span>
} @else {
  <span class="embleme" [class.disque]="fond() === 'sombre'" [style.width.px]="taille()" [style.height.px]="taille()">
    <img [src]="embleme()" alt="" />
  </span>
}
@if (avecNom()) {
  <div class="txt">
    <!-- Nom de l'application en texte (Si-SNJ) : remplace les images logo_nom_app*.png qui portaient l'ancien nom -->
    <span class="nom-texte" [class.vert]="!ecusson()" [class.sur-sombre]="fond() === 'sombre'" [style.font-size.px]="taille() * 0.56">Si-<em>SNJ</em></span>
    @if (sousTitre()) { <span>{{ sousTitre() }}</span> }
  </div>
}
