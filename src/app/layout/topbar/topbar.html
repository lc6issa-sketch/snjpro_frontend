<button type="button" class="recherche" (click)="shell.recherche.set(true)">
  <app-icon name="search" [size]="17" />
  <span class="grow">Rechercher un membre, un identifiant…</span>
</button>
<div class="droite">
  <a routerLink="/messagerie" class="rond" title="Messagerie" aria-label="Messagerie">
    <app-icon name="message-square" [size]="18" />
    @if (shell.messagesNonLus()) { <i class="point"></i> }
  </a>
  <button type="button" class="rond" [class.ouvert]="shell.panneauNotifications()" title="Notifications" aria-label="Notifications"
          (click)="basculerNotifications($event)">
    <app-icon name="bell" [size]="18" />
    @if (shell.alertesNonLues()) { <i class="point"></i> }
  </button>
  <div class="profil-zone">
    <button type="button" class="profil" (click)="menu.set(!menu()); $event.stopPropagation()">
      <app-avatar [nom]="auth.nomComplet()" [photo]="shell.photo()" [size]="34" />
      <span class="col">
        <strong>{{ auth.nomComplet() }}</strong>
        <small>{{ auth.libelleRole() }}</small>
      </span>
      <app-icon name="chevron-down" [size]="16" class="faint" />
    </button>
    @if (menu()) {
      <div class="menu card" (click)="$event.stopPropagation()">
        <a routerLink="/parametres" [queryParams]="{ onglet: 'profil' }" (click)="menu.set(false)"><app-icon name="user" [size]="16" />Mon profil</a>
        <a routerLink="/parametres" [queryParams]="{ onglet: 'securite' }" (click)="menu.set(false)"><app-icon name="lock" [size]="16" />Sécurité</a>
        <a routerLink="/parametres" [queryParams]="{ onglet: 'notifications' }" (click)="menu.set(false)"><app-icon name="bell" [size]="16" />Préférences</a>
        <hr class="divider" />
        <button type="button" class="danger" (click)="auth.logout()"><app-icon name="log-out" [size]="16" />Se déconnecter</button>
      </div>
    }
  </div>
</div>
